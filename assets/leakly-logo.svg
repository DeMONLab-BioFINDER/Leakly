<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
  <title id="title">Leakly logo</title>
  <desc id="desc">Leakly wordmark with train-test split and leakage check icon.</desc>
  <defs>
    <linearGradient id="markGradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#16a3a8"/>
      <stop offset="1" stop-color="#3558d4"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#18213a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <rect x="52" y="42" width="136" height="136" rx="32" fill="url(#markGradient)"/>
  </g>
  <path d="M84 100h42c16 0 29 13 29 29v22" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"/>
  <path d="M84 73h58c25 0 46 21 46 46v32" fill="none" stroke="#baf3f3" stroke-width="13" stroke-linecap="round" opacity="0.9"/>
  <path d="M118 149l26-26 26 26" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="85" cy="73" r="9" fill="#fff"/>
  <circle cx="85" cy="100" r="9" fill="#fff"/>
  <circle cx="188" cy="151" r="9" fill="#fff"/>

  <text x="222" y="107" fill="#172033" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="800">Leakly</text>
  <text x="226" y="151" fill="#526071" font-family="Arial, Helvetica, sans-serif" font-size="25">leakage checks for ML pipelines</text>
</svg>
