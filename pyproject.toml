[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Leakly"
dynamic = ["version"]
description = "Leakage checks for machine-learning pipelines using permutation tests."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "DeMONLab-BioFINDER" },
]
keywords = [
    "data-leakage",
    "machine-learning",
    "permutation-test",
    "scikit-learn",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "joblib>=1.3,<2.0",
    "matplotlib>=3.7,<4.0",
    "numpy>=1.23,<2.4",
    "pandas>=1.5,<3.0",
    "PyYAML>=6.0,<7.0",
    "scikit-learn>=1.6,<1.7",
    "scipy>=1.9,<1.16",
    "tqdm>=4.64,<5.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "twine>=5.0",
    "wheel>=0.41",
]
notebook = [
    "ipykernel>=6.0",
    "ipywidgets>=8.0",
    "jupyter>=1.0",
]

[project.urls]
Homepage = "https://github.com/DeMONLab-BioFINDER/Leakly"
Source = "https://github.com/DeMONLab-BioFINDER/Leakly"
Issues = "https://github.com/DeMONLab-BioFINDER/Leakly/issues"

[tool.setuptools.dynamic]
version = { attr = "leakly.__version__" }

[tool.setuptools.packages.find]
include = ["leakly", "leakly.*"]

[tool.setuptools.package-data]
leakly = ["*.yaml"]

[tool.setuptools]
include-package-data = true
